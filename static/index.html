<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proxy Hearts</title>
<style>
:root{color-scheme:light;--bg:#fbf7f4;--card:#fff;--ink:#22181d;--mute:#7d6f76;--line:#efe4e7;--soft:#fbf3f6;--acc:#e0356f;--acc2:#7b4dff;--ok:#2f9e44;--warn:#e8590c;--bad:#e03131;--li:#0a66c2;
  --grad:linear-gradient(135deg,#ff5f8f,#7b4dff);--sh:0 1px 2px rgba(34,24,29,.04),0 10px 28px -14px rgba(34,24,29,.16)}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow-wrap:anywhere}
a{color:inherit}
h1,h2,.brand{font-family:ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 10px}h2{font-size:22px;margin:0 0 4px}
h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
p{margin:0 0 8px}.mute{color:var(--mute);font-size:13.5px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1140px;margin:0 auto;padding:10px 16px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.brand{font-size:21px;font-weight:700;text-decoration:none;margin-right:auto;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mute);font-weight:600;font-size:14px;padding:6px 11px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;transition:.2s}
nav a:hover{background:var(--soft);color:var(--ink)}nav a.on{background:var(--ink);color:#fff}
nav a .n{font-size:11px;background:var(--line);color:var(--ink);border-radius:99px;padding:0 7px}nav a.on .n{background:rgba(255,255,255,.2);color:#fff}
main{max-width:1140px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
a.card{display:block;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}a.card:hover{transform:translateY(-2px);border-color:#f3b6cb}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.av{--h:330;position:relative;width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:inline-grid;place-items:center;font-weight:700;font-size:15px;
  background:hsl(var(--h) 75% 93%);color:hsl(var(--h) 45% 35%);box-shadow:0 0 0 2px #fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:11px}.av.lg{width:64px;height:64px;font-size:22px}.av.xl{width:104px;height:104px;font-size:34px}
.pair{display:flex}.pair .av+.av{margin-left:-12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#fdeef3;color:#a61e4d;border-radius:99px;padding:3px 11px;font-size:13px}
.chips.v span{background:#f1ecff;color:#5f3dc4}.chips.g span{background:#ebfbee;color:#2b8a3e}.chips.r span{background:#fff1e6;color:#c2410c}.chips.n span{background:#f3f0f1;color:#4a3f45}
button,.btn{font:inherit;font-weight:650;font-size:14px;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s,opacity .2s;white-space:nowrap}
button:hover,.btn:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:default;transform:none}
.primary{background:var(--grad);box-shadow:0 8px 22px -10px #e0356f}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.ghost.danger{color:var(--bad)}.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.big-btn{font-size:16px;padding:14px 22px;border-radius:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:4px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:#f08fb0;box-shadow:0 0 0 4px #fde3ec}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--acc2);margin:4px 0 10px}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:#f3f0f1;color:#4a3f45;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.work{background:#fff3e8;color:var(--warn)}.pill.ok{background:#ebfbee;color:var(--ok)}.pill.bad{background:#fff0f0;color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.meter{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--grad);border-radius:9px}
.enter .meter i{animation:grow .9s cubic-bezier(.2,.8,.2,1)}@keyframes grow{from{width:0}}
.enter>*{animation:rise .45s both}.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;flex:none}.spin.dk{border-color:#f3c6d6;border-top-color:var(--acc)}
@keyframes rot{to{transform:rotate(360deg)}}
/* pipeline */
#pipe:empty{display:none}
.pipe{background:var(--grad);color:#fff}.pipe .bar-in{padding:8px 16px;font-size:14px}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.steps li{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:4px 11px;border-radius:99px;background:rgba(0,0,0,.05);color:var(--mute)}
.steps li.done{background:#ebfbee;color:var(--ok)}.steps li.on{background:var(--ink);color:#fff}
.pipe .steps li{background:rgba(255,255,255,.18);color:#fff}.pipe .steps li.on{background:#fff;color:var(--acc)}.pipe .steps li.done{background:rgba(255,255,255,.32);color:#fff}
/* hero */
.hero{padding:26px 22px;border-radius:22px;background:radial-gradient(120% 140% at 0% 0%,#ffe3ec 0%,#fff 45%,#efe9ff 100%);border:1px solid var(--line);margin-bottom:18px}
.flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:14px 0 0;counter-reset:f}
.flow li{counter-increment:f;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:13.5px;font-weight:600}
.flow li::before{content:counter(f);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-size:11px;margin-right:7px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}.stats b{font-size:20px;display:block;font-family:ui-serif,Georgia,serif}.stats span{font-size:12px;color:var(--mute)}
/* agent cards */
.agent{position:relative;overflow:hidden;text-align:center;padding:22px 16px 16px}
.agent .av{margin:0 auto 10px}.agent h4{margin:0;font-size:16px}.agent .hl{font-size:13px;color:var(--mute);margin:2px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.agent .foot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mute);display:flex;gap:6px;justify-content:center;align-items:center}
.working::before{content:"";position:absolute;left:0;top:0;height:3px;width:40%;background:var(--grad);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
/* profile */
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.links a{color:var(--mute);font-size:13.5px;margin-right:12px}
.summary{font-family:ui-serif,Georgia,serif;font-size:19px;line-height:1.5;border-left:4px solid var(--acc);padding-left:16px;margin:4px 0 0}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px 26px;margin-top:20px}
.secs p{font-size:14.5px}
.brief{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box}
.brief .ideal{font-family:ui-serif,Georgia,serif;font-size:18px;margin:6px 0 16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ev{display:grid;gap:0}.ev>div{display:grid;grid-template-columns:110px 1fr 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ev .inf{color:var(--acc2)}
.src{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#f3f0f1;color:#4a3f45;height:fit-content;width:fit-content}
.src.li{background:#e7f0fb;color:var(--li)}.src.ig{background:linear-gradient(90deg,#fde7ef,#f3e8ff);color:#c2255c}
.conf{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.working-card{display:flex;gap:16px;align-items:center}
.match,.rrow{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(120px,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.match:first-of-type,.rrow:first-of-type{border-top:0}
.match .reason,.rrow .why{grid-column:2/-1;font-size:14px;color:#4a3f45;margin:0}
.pos{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:20px;color:var(--acc)}
.who{display:flex;gap:10px;align-items:center;text-decoration:none;min-width:0}.who small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fit{display:flex;gap:10px;align-items:center}.fit .meter{flex:1}.fit b{font-size:15px;min-width:26px;text-align:right}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}.tag.dated{background:#f1ecff;color:#5f3dc4}.tag.est{border:1px dashed #cdbfc5;color:var(--mute)}.tag.mut{background:#ffe3ec;color:var(--acc)}
/* recursive data */
.via{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.05em}
.err{color:var(--bad);background:#fff5f5;border-radius:10px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.kvs{display:grid}.kv{display:grid;grid-template-columns:minmax(90px,150px) 1fr;gap:12px;padding:7px 0;border-top:1px solid #f6eef1;font-size:14px}.kv:first-child{border-top:0}
.kv .k{color:var(--mute);font-size:12.5px;font-weight:600}
.minis{display:grid;gap:8px}.mini{background:var(--soft);border-radius:12px;padding:8px 12px}.mini .kv{grid-template-columns:minmax(70px,110px) 1fr;padding:4px 0}
.list{display:grid;gap:4px}.list>div{padding-left:12px;border-left:2px solid var(--line)}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);white-space:pre-wrap}
.clamp.open{display:block;-webkit-mask-image:none;mask-image:none}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.url{color:var(--li);font-size:13px}
/* dates */
.dcard .pair{margin-bottom:10px}.dcard .last{font-size:13.5px;color:#4a3f45;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0}
.scores{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--acc);font-size:18px}
.chat{max-height:62vh;overflow-y:auto;padding:4px 4px 8px;scroll-behavior:auto}
.msg{display:flex;gap:10px;align-items:flex-end;margin:12px 0;max-width:82%}.msg.r{margin-left:auto;flex-direction:row-reverse}
.bub{padding:10px 15px;border-radius:18px 18px 18px 6px;background:#fdeef3;font-size:15px}.msg.r .bub{border-radius:18px 18px 6px 18px;background:#f1ecff}
.bub small{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:2px}.bub em{color:var(--mute)}
.msg.new{animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
.typing .bub{display:flex;gap:4px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:#c9b8c0;animation:bob 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.sys{text-align:center;color:var(--mute);font-size:13.5px;margin:16px 0;display:flex;gap:8px;justify-content:center;align-items:center}
.venue{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13.5px;margin-top:6px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;font-family:ui-serif,Georgia,serif}
.outcome{text-align:center;font-weight:700;padding:12px;border-radius:14px;margin-bottom:16px}.outcome.yes{background:var(--grad);color:#fff}.outcome.no{background:#f3f0f1;color:var(--mute)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#f3eef0,#fbf7f8,#f3eef0);background-size:200% 100%;animation:sh 1.3s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
/* rankings */
.people-pick{display:flex;gap:8px;flex-wrap:wrap}.people-pick a{display:inline-flex;gap:7px;align-items:center;text-decoration:none;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:#fff}
.people-pick a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.top3 ol{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}.top3 li{display:flex;gap:8px;align-items:center;font-size:14px}.top3 li .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top3 li b{color:var(--acc)}.top3 li:first-child{font-weight:650}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;transition:.3s;z-index:9;max-width:calc(100% - 32px);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
@media(max-width:700px){.row{grid-template-columns:1fr}.msg{max-width:94%}.ev>div{grid-template-columns:1fr;gap:4px}.kv{grid-template-columns:1fr;gap:2px}
  .match,.rrow{grid-template-columns:28px minmax(0,1fr) auto}.match .fit,.rrow .fit{grid-column:2/3}.match .reason,.rrow .why{grid-column:2/-1}
  .match>:last-child,.rrow>:last-child{grid-column:2/-1;justify-self:start}.card{padding:16px}.brand{font-size:19px}}
</style>
</head>
<body>
<header><div class="bar-in"><a class="brand" href="#add">&#9829; Proxy Hearts</a><nav>
  <a href="#add">1 &middot; Add</a><a href="#people">2 &middot; Agents <span class="n" id="n-people">0</span></a>
  <a href="#dates">3 &middot; Dates <span class="n" id="n-dates">0</span></a><a href="#rank">4 &middot; Rankings</a></nav></div></header>
<div id="pipe"></div>
<main id="app"></main>
<div id="toast"></div>
<script>
let S = {people:{}, dates:{}, rankings:{}, pipeline:{running:false, step:''}};
let lastJSON = '', lastHTML = '', lastRoute = '', busy = false, enterT;
const seen = {};  // date id -> transcript lines already shown (only newer ones animate in)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = s => esc(encodeURIComponent(s));
const arr = x => Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]);
const num = x => Math.max(0, Math.min(100, Math.round(+x || 0)));
const href = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const P = id => S.people[id] || {id, name:'(removed)'};
const nm = p => p.name || p.profile?.name || ((String(p.instagram || '').match(/instagram\.com\/([^/?#]+)/i) || [])[1] ? '@' + String(p.instagram).match(/instagram\.com\/([^/?#]+)/i)[1] : 'New agent');
const hue = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const initials = p => nm(p).replace(/^@/, '').split(/[\s._]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
const av = (p, c = '') => `<span class="av ${c}" style="--h:${hue(p.id || nm(p))}"><span>${esc(initials(p))}</span>${p.photo ? `<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : ''}</span>`;
const txt = x => typeof x === 'object' && x ? Object.values(x).join(' — ') : x;
const chips = (xs, c = '') => arr(xs).length ? `<div class="chips ${c}">${arr(xs).map(x => `<span>${esc(txt(x))}</span>`).join('')}</div>` : '<p class="mute">&mdash;</p>';
const val = (v, c) => Array.isArray(v) ? chips(v, c) : (v ? `<p>${esc(txt(v))}</p>` : '<p class="mute">&mdash;</p>');
const sec = (t, v, c = '') => `<div><h3>${t}</h3>${val(v, c)}</div>`;
const meter = (x, wide) => `<div class="fit"><div class="meter"><i style="width:${num(x)}%"></i></div><b>${num(x)}</b></div>`;
const isWork = s => !!s && s !== 'ready' && s !== 'done' && !/^error/i.test(s);
const pill = s => { s = s || 'queued'; const k = /^error/i.test(s) ? 'bad' : (s === 'ready' || s === 'done') ? 'ok' : 'work';
  return `<span class="pill ${k}" title="${esc(s)}">${k === 'work' ? '<i class="dot"></i>' : ''}${esc(s.length > 46 ? s.slice(0, 44) + '…' : s)}</span>`; };
const srcCls = s => /insta/i.test(s) ? 'ig' : /linked/i.test(s) ? 'li' : '';
const human = k => String(k).replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').trim().replace(/^./, c => c.toUpperCase());
const ready = () => Object.values(S.people).filter(p => p.profile);
const findDate = (a, b) => Object.values(S.dates).filter(d => ((d.a === a && d.b === b) || (d.a === b && d.b === a)) && !/^error/i.test(d.status || '')).pop();
const dateBtn = (a, b, id) => { const d = (id && S.dates[id]) || findDate(a, b);
  return d ? `<a class="btn ghost sm" href="#d/${enc(d.id)}">${d.status === 'done' ? 'Read the date' : '<i class="dot" style="color:var(--acc)"></i> Watch live'} &rarr;</a>`
           : `<button class="sm" data-act="date" data-a="${esc(a)}" data-b="${esc(b)}">&#9829; Send on a date</button>`; };
const empty = (msg, link = '') => `<div class="card empty"><p>${msg}</p>${link}</div>`;

// pipeline stepper: Read -> Search -> Date -> Rank
const STAGES = [['Read people', /read|analy|people|scrap/], ['Agents search', /search/], ['Agents date', /dat/], ['Rank', /rank/]];
function steps() { const pl = S.pipeline || {}, s = String(pl.step || '').toLowerCase();
  let at = s === 'done' || (!pl.running && /done/.test(s)) ? STAGES.length : pl.running ? STAGES.findIndex(([, re]) => re.test(s)) : -1;
  return `<ol class="steps">${STAGES.map(([t], i) => `<li class="${i < at ? 'done' : i === at ? 'on' : ''}">${i < at ? '&#10003;' : i === at ? '<i class="dot"></i>' : i + 1} ${t}</li>`).join('')}</ol>`; }

// generic recursive renderer for scraped source JSON
function tree(v, d = 0) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'number') return esc(v.toLocaleString());
  if (typeof v !== 'object') { const s = String(v);
    if (/^https?:\/\/\S+$/i.test(s)) return /\.(jpe?g|png|webp|gif)(\?|$)|cdninstagram|fbcdn|licdn|media\./i.test(s)
      ? `<a href="${href(s)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(s)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentNode.remove()"></a>`
      : `<a class="url" href="${href(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/i, '').slice(0, 60))}</a>`;
    return s.length > 220 ? `<div class="clamp" data-act="clamp" title="Click to expand">${esc(s)}</div>` : esc(s); }
  if (d > 5) return `<code>${esc(JSON.stringify(v).slice(0, 200))}</code>`;
  if (Array.isArray(v)) {
    if (v.every(x => x != null && typeof x !== 'object' && String(x).length < 60 && !/^https?:/i.test(x))) return chips(v, 'n');
    const objs = v.some(x => x && typeof x === 'object'), cls = objs ? 'minis' : 'list';
    const items = v.map(x => tree(x, d + 1)).filter(Boolean).map(h => `<div class="${objs ? 'mini' : ''}">${h}</div>`);
    return `<div class="${cls}">${items.slice(0, 6).join('')}</div>` + (items.length > 6 ? `<details><summary>+ ${items.length - 6} more</summary><div class="${cls}">${items.slice(6).join('')}</div></details>` : ''); }
  const rows = Object.entries(v).map(([k, x]) => { const h = tree(x, d + 1); return h ? `<div class="kv"><div class="k">${esc(human(k))}</div><div class="v">${h}</div></div>` : ''; }).join('');
  return rows ? `<div class="kvs">${rows}</div>` : '';
}

  if (busy) return; busy = true;
  try { const t = await fetch('/api/state').then(r => r.text());
    if (t !== lastJSON) { lastJSON = t; const s = JSON.parse(t);
      S = {...s, people: s.people || {}, dates: s.dates || {}, rankings: s.rankings || {}, pipeline: s.pipeline || {running: false, step: ''}}; render(); }
  } catch (e) { /* server restarting: try again next tick */ } finally { busy = false; }
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3200); }
async function api(path, body) {
  try { const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    const j = await r.json().catch(() => ({error: 'HTTP ' + r.status}));
    if (!r.ok || j.error) { toast(j.error || 'HTTP ' + r.status, true); return null; }
    lastJSON = ''; refresh(); return j;
  } catch (e) { toast(String(e), true); return null; }
}
const goDate = async (a, b) => { if (!a || !b || a === b) return toast('Pick two different agents', true); const r = await api('/api/date', {a, b}); if (r?.id) location.hash = 'd/' + encodeURIComponent(r.id); };
const person = id => `/api/people/${encodeURIComponent(id)}/`;
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset;
  if (a.act === 'clamp') return t.classList.toggle('open');
  if (t.tagName === 'BUTTON') { if (t.disabled) return; t.disabled = true; setTimeout(() => t.disabled = false, 1500); }
  switch (a.act) {
    case 'run': if (await api('/api/run')) toast('Pipeline started: search → date → rank'); break;
    case 'date': await goDate(a.a, a.b); break;
    case 'pick': await goDate($('#da').value, $('#db').value); break;
    case 'analyze': if (await api(person(a.id) + 'analyze')) toast('The agent is re-reading its person…'); break;
    case 'search': if (await api(person(a.id) + 'search')) toast('The agent is searching the pool…'); break;
    case 'del': if (confirm(`Delete ${a.name}'s agent and its dates?`) && await api(person(a.id) + 'delete')) location.hash = 'people'; break;
    case 'addOne': { const g = k => $('#' + k).value.trim();
      if (!g('li') || !g('ig')) return toast('Both a LinkedIn and an Instagram URL are needed', true);
      if (await api('/api/people', {people: [{linkedin: g('li'), instagram: g('ig'), li_text: g('lit'), ig_text: g('igt'), gender: g('gen'), seeking: g('seek')}]})) { toast('Agent created. It is reading its person now.'); location.hash = 'people'; }
      break; }
    case 'addBulk': { const people = $('#bulk').value.split('\n').map(l => l.trim().split(/[\s,;]+/).filter(Boolean)).filter(x => x.length >= 2)
        .map(x => ({linkedin: x.find(u => /linkedin\.com/i.test(u)) || x[0], instagram: x.find(u => /instagram\.com/i.test(u)) || x[1]}));
      if (!people.length) return toast('One person per line: linkedin_url instagram_url', true);
      const r = await api('/api/people', {people}); if (r) { toast(`${(r.ids || []).length} agents created`); location.hash = 'people'; }
      break; }
  }
});
window.onhashchange = render;
render(); refresh(); setInterval(refresh, 1500);
</script>
