<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Proxy Hearts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#000;--s1:#0e0e10;--s2:#17171b;--s3:#212127;--line:#25252b;--line2:#34343c;
  --ink:#f6f2f4;--ink2:#cfc9cd;--mute:#8e8892;--dim:#5d5862;
  --acc:#ff2d87;--acc2:#ff6fae;--accbg:rgba(255,45,135,.12);
  --amb:#ffb02e;--ambbg:rgba(255,176,46,.12);
  --ok:#3ddc97;--okbg:rgba(61,220,151,.12);--bad:#ff5d5d;--badbg:rgba(255,93,93,.12);
  --serif:"Instrument Serif",ui-serif,Georgia,serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
::selection{background:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(40px,8vw,84px);line-height:.98}
h2{font-size:clamp(26px,4vw,34px);line-height:1.08}
h3{font-size:22px;line-height:1.15}
p{margin:0 0 8px}
.mute{color:var(--mute)}.small{font-size:13.5px}
.grow{flex:1;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}

/* ---------- top bar / tabs ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.78);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;font-family:var(--serif);font-size:25px;letter-spacing:-.01em;white-space:nowrap}
.logo svg{width:26px;height:26px;flex:none}
.logo em{color:var(--acc)}
nav.tabs{display:flex;gap:2px}
nav.tabs a{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--mute);font-weight:600;font-size:14.5px;padding:8px 13px;border-radius:99px;transition:color .2s,background .2s;position:relative}
nav.tabs a svg{width:18px;height:18px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);background:var(--s2)}
nav.tabs .n{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.pipe{background:linear-gradient(90deg,rgba(255,176,46,.14),rgba(255,45,135,.14));border-bottom:1px solid var(--line);font-size:14px}
.pipe .top-in{padding:8px 16px;gap:10px}
.pipe b{color:var(--amb);font-weight:700}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:28px 16px 120px}
main.enter>*{animation:rise .45s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}main.enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.blk{margin-bottom:22px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.tight{padding:16px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 2px 14px}
.sec-h p{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.two,.three{grid-template-columns:1fr}}

/* ---------- controls ---------- */
button,.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:99px;padding:12px 20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;background:var(--s3);color:var(--ink);transition:transform .15s var(--ease),background .2s,opacity .2s;white-space:nowrap}
button:hover,.btn:hover{background:var(--line2)}
button:active,.btn:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.primary{background:var(--acc);color:#fff;box-shadow:0 8px 30px -10px rgba(255,45,135,.7)}
.primary:hover{background:#ff4796}
.ghost{background:transparent;border:1px solid var(--line2)}
.ghost:hover{background:var(--s2)}
.sm{padding:8px 14px;font-size:13.5px}
.lg{padding:16px 28px;font-size:17px}
.danger{color:var(--bad)}
.linkish{background:none;padding:0;color:var(--mute);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.linkish:hover{background:none;color:var(--ink)}
label.f{display:block;font-weight:600;font-size:14px;color:var(--ink2);margin-bottom:14px}
input,textarea,select{font:inherit;font-size:16px;width:100%;margin-top:7px;padding:13px 15px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input[type=range]{padding:0;border:0;background:none;box-shadow:none;accent-color:var(--acc);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--ink2);cursor:pointer;transition:all .18s var(--ease)}
.chip:hover{border-color:var(--mute);background:transparent;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.big{padding:14px 20px;font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--s2);color:var(--ink2);border:1px solid var(--line)}
.tag.g{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.r{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.p{background:var(--accbg);color:var(--acc2);border-color:transparent}

/* ---------- avatars ---------- */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;position:relative;display:inline-grid;place-items:center;overflow:hidden;
  background:hsl(var(--h) 45% 22%);color:hsl(var(--h) 80% 82%);font-weight:800;font-size:calc(var(--s)*.36);letter-spacing:.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.xs{--s:26px}.av.sm{--s:34px}.av.lg{--s:64px}.av.xl{--s:96px}.av.xxl{--s:128px}
.av.ring-acc{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.pair{display:flex}.pair .av+.av{margin-left:-14px;box-shadow:0 0 0 3px var(--s1)}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.work{background:var(--ambbg);color:var(--amb)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.live{background:var(--accbg);color:var(--acc2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);padding:3px 10px;border-radius:8px;background:var(--s2)}
.badge.u{color:var(--acc2)}.badge.f{color:var(--amb)}
.stage{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.stage.dated{background:var(--accbg);color:var(--acc2)}.stage.pre{background:var(--s2);color:var(--mute);border:1px dashed var(--line2)}

/* ---------- score ring / bars ---------- */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:5}
.ring .trk{stroke:var(--s3)}
.ring .val{stroke:var(--acc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;animation:ringIn 1.2s var(--ease) both}
.ring.mid .val{stroke:var(--amb)}.ring.low .val{stroke:var(--mute)}
.ring b{font-family:var(--serif);font-weight:400;font-size:calc(var(--rs)*.38);line-height:1}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.bar{display:flex;align-items:center;gap:10px;min-width:120px}
.bar .t{flex:1;height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar .t i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:barIn 1s var(--ease) both}
.bar b{font-family:var(--serif);font-weight:400;font-size:22px;min-width:30px;text-align:right}
@keyframes barIn{from{width:0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- welcome ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:calc(100vh - 200px);padding:20px 0 40px}
.hero h1 .soft{color:var(--mute)}
.hero .lede{font-size:clamp(17px,2.1vw,20px);color:var(--ink2);max-width:34ch;margin:24px 0 32px;line-height:1.5}
.hero .ctas{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .sub{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
.hero .sub a{color:var(--mute);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:2px}
.hero .sub a:hover{color:var(--ink);border-color:var(--ink)}
.demo{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:18px;position:relative;overflow:hidden}
.demo::before{content:"";position:absolute;inset:-40% -20% auto auto;width:300px;height:300px;background:radial-gradient(closest-side,rgba(255,45,135,.25),transparent);pointer-events:none}
.demo .venue{font-size:13px;color:var(--mute);margin:2px 0 14px;display:flex;align-items:center;gap:8px}
.demo .msg{opacity:0;animation:pop .5s var(--ease) forwards}
.demo .m1{animation-delay:.5s}.demo .m2{animation-delay:1.6s}.demo .m3{animation-delay:2.8s}.demo .m4{animation-delay:4s}.demo .m5{animation-delay:5s}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:10px}
.how div{border-top:1px solid var(--line2);padding-top:14px}
.how b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;margin-bottom:4px}
.how span{color:var(--mute);font-size:14.5px}
.users{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.users a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:6px 14px 6px 6px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-weight:600}
.users a:hover{border-color:var(--acc)}
@media(max-width:860px){.hero{grid-template-columns:1fr;min-height:0;gap:28px}.how{grid-template-columns:1fr 1fr}}

/* ---------- onboarding ---------- */
.wiz{max-width:640px;margin:0 auto}
.wiz .prog{height:4px;border-radius:99px;background:var(--s3);overflow:hidden;margin-bottom:10px}
.wiz .prog i{display:block;height:100%;background:var(--acc);transition:width .5s var(--ease)}
.wiz .count{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:36px;display:flex;justify-content:space-between}
.wiz h2{font-size:clamp(36px,7vw,54px);line-height:1;margin-bottom:10px}
.wiz .why{color:var(--mute);margin-bottom:30px;font-size:16.5px}
.wiz .body{animation:stepIn .4s var(--ease) both}
.wiz .body.back{animation-name:stepBack}
@keyframes stepIn{from{opacity:0;transform:translateX(24px)}}
@keyframes stepBack{from{opacity:0;transform:translateX(-24px)}}
.wiz .grp{margin-bottom:28px}
.wiz .grp>.lbl{font-weight:700;font-size:15px;margin-bottom:10px;display:block}
.wiz .foot{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);gap:12px}
.wiz .hint{font-size:12.5px;color:var(--dim)}
.wiz .err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin-top:6px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{margin:0}
.addrow button{flex:none}
.range{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.range .val{font-family:var(--serif);font-size:34px;line-height:1}
.photo-drop{display:flex;align-items:center;gap:22px;cursor:pointer;padding:20px;border:1px dashed var(--line2);border-radius:var(--r);transition:border-color .2s}
.photo-drop:hover{border-color:var(--acc)}
.photo-drop .pv{width:140px;height:140px;border-radius:50%;background:var(--s2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--dim)}
.photo-drop .pv img{width:100%;height:100%;object-fit:cover}
.photo-drop .pv svg{width:40px;height:40px}
.review{display:grid;gap:2px}
.review .r{display:grid;grid-template-columns:130px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.review .r .k{color:var(--mute);font-size:14px;font-weight:600}
@media(max-width:560px){.review .r{grid-template-columns:1fr auto}.review .r .k{grid-column:1/-1}.photo-drop{flex-direction:column;text-align:center}}

/* ---------- me / profile ---------- */
.me-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.me-head h1{font-size:clamp(40px,7vw,64px)}
.me-head .meta{color:var(--mute);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hunt{position:relative;overflow:hidden;border-color:var(--line2)}
.hunt.running{border-color:rgba(255,176,46,.45)}
.hunt.running::after{content:"";position:absolute;left:0;top:0;height:2px;width:35%;background:linear-gradient(90deg,transparent,var(--amb),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.hunt-top{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--s2);border-radius:99px;padding:4px;gap:2px}
.seg button{padding:8px 14px;font-size:14px;background:transparent;color:var(--mute)}
.seg button.on{background:var(--ink);color:#000}
.hprog{margin-top:16px;display:flex;align-items:center;gap:12px;color:var(--amb);font-weight:600;font-size:14.5px}
.hprog .t{flex:1;height:4px;background:var(--s3);border-radius:99px;overflow:hidden}
.hprog .t i{display:block;height:100%;background:var(--amb);transition:width .6s var(--ease)}
.log{margin:16px 0 0;padding:14px 16px;list-style:none;background:#050505;border:1px solid var(--line);border-radius:16px;font:12.5px/1.6 var(--mono);max-height:340px;overflow-y:auto;scroll-behavior:smooth}
.log li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:3px 0;color:var(--ink2)}
.log li time{color:var(--dim)}
.log li .k{width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--amb)}
.log li.hit .k{background:var(--acc)}.log li.hit span{color:var(--ink)}
.log li.dt .k{background:var(--ok)}
.log li.is-new{animation:logIn .5s var(--ease) both}
.log li.cursor span::after{content:"";display:inline-block;width:7px;height:13px;background:var(--amb);margin-left:4px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes logIn{from{opacity:0;transform:translateX(-8px);background:rgba(255,176,46,.12)}}
@keyframes blink{50%{opacity:0}}
.pcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;position:relative;overflow:hidden;transition:border-color .2s,transform .2s var(--ease)}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pcard .hd{display:flex;gap:12px;align-items:center}
.pcard .nm{font-weight:700;font-size:16.5px;line-height:1.25}
.pcard .hl{font-size:13.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .rs{font-size:14px;color:var(--ink2);border-left:2px solid var(--acc);padding-left:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .ft{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.working::before{content:"";position:absolute;left:0;top:0;height:2px;width:40%;background:linear-gradient(90deg,transparent,var(--amb),transparent);animation:scan 1.6s ease-in-out infinite}
.pcard.working{border-color:rgba(255,176,46,.35)}
.understand .summary{font-family:var(--serif);font-size:clamp(21px,2.6vw,26px);line-height:1.3;margin:6px 0 20px;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 26px}
.facts h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--mute)}
.facts p{color:var(--ink2);font-size:15px}
.brief{background:linear-gradient(160deg,rgba(255,45,135,.1),transparent 60%),var(--s1)}
.brief .ideal{font-family:var(--serif);font-size:clamp(22px,2.8vw,28px);line-height:1.25;margin:8px 0 18px}
.rrow{display:grid;grid-template-columns:34px auto 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .pos{font-family:var(--serif);font-size:28px;color:var(--dim)}
.rrow .who{display:flex;gap:12px;align-items:center;text-decoration:none;min-width:0}
.rrow .who b{display:block}
.rrow .why{grid-column:3/-1;font-size:14.5px;color:var(--ink2);margin:0}
.rrow .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.rrow{grid-template-columns:28px 1fr auto}.rrow>.ring{grid-column:3;grid-row:1}.rrow .who{grid-column:2}.rrow .why,.rrow .acts{grid-column:1/-1}.rrow .acts{justify-content:flex-start}}
.phead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.phead h1{font-size:clamp(38px,6vw,58px)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14.5px}
.links a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2)}
.links a:hover{color:var(--acc2);border-color:var(--acc2)}
.ev{display:grid;gap:0}
.ev .e{display:grid;grid-template-columns:100px 1fr 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ev .e:last-child{border-bottom:0}
.ev .s{font-weight:700;font-size:12.5px;color:var(--amb)}
.ev .i{color:var(--ink)}
.ev .sg{color:var(--mute)}
@media(max-width:640px){.ev .e{grid-template-columns:1fr;gap:4px}}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px 26px}
.answers h4{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:700}
.quote{font-family:var(--serif);font-size:20px;line-height:1.3}
.match{display:grid;grid-template-columns:auto 1fr minmax(120px,200px) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .who{display:flex;gap:12px;align-items:center;text-decoration:none;min-width:0}
.match .reason{grid-column:2/-1;margin:0;font-size:14.5px;color:var(--ink2)}
@media(max-width:640px){.match{grid-template-columns:auto 1fr}.match .bar,.match>.btn,.match>button,.match .reason{grid-column:1/-1}}
/* source tree */
.kvs{display:grid;gap:8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:12px;font-size:14px}
.kv .k{color:var(--mute);font-weight:600}

.list>div+div{margin-top:4px}

/* ---------- dates ---------- */

@keyframes ty{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.sys{align-self:center;font-size:13.5px;color:var(--mute);display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:99px;background:var(--s2)}
.mutual{border-radius:var(--r);padding:22px;text-align:center;font-family:var(--serif);font-size:clamp(26px,4vw,36px);background:radial-gradient(120% 200% at 50% 0%,rgba(255,45,135,.35),rgba(255,45,135,.05) 60%),var(--s1);border:1px solid rgba(255,45,135,.5);animation:pop .6s var(--ease) both}
.mutual.no{background:var(--s1);border-color:var(--line);color:var(--mute);font-size:24px}
.deb .top{display:flex;gap:18px;align-items:center;margin:12px 0 16px}
.deb .chem{font-family:var(--serif);font-size:20px;line-height:1.35;font-style:italic;color:var(--ink2);margin:6px 0 16px}

/* rank */

.picker a{display:flex;gap:8px;align-items:center;text-decoration:none;padding:5px 14px 5px 5px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:14px;flex:none}
.picker a.txt{padding:8px 16px}
.picker a.on{border-color:var(--acc);background:var(--accbg)}
.top3 ol{list-style:none;margin:14px 0 0;padding:0}
.top3 li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.top3 li .p{font-family:var(--serif);font-size:20px;color:var(--dim);width:18px}
.top3 li b{font-family:var(--serif);font-weight:400;font-size:22px}
.mutuals{display:flex;gap:12px;flex-wrap:wrap}
.mutuals a{display:flex;gap:12px;align-items:center;text-decoration:none;padding:10px 18px 10px 10px;border-radius:99px;background:var(--accbg);border:1px solid rgba(255,45,135,.35);font-weight:700}

.empty{text-align:center;padding:48px 22px}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#000;font-weight:700;padding:13px 20px;border-radius:16px;z-index:50;transition:all .3s var(--ease);max-width:calc(100% - 32px);pointer-events:none;font-size:14.5px}

@media(max-width:720px){

  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#welcome" aria-label="Proxy Hearts home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28S3 20 3 11.5A6.5 6.5 0 0 1 16 8a6.5 6.5 0 0 1 13 3.5C29 20 16 28 16 28z" fill="#ff2d87"/><circle cx="21.5" cy="12.5" r="3" fill="#000"/><circle cx="21.5" cy="12.5" r="1.4" fill="#ffb02e"/></svg>Proxy <em>Hearts</em></a>
    <nav class="tabs" aria-label="Main">
      <a href="#me" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</a>
      <a href="#pool" data-tab="pool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.2"/><circle cx="17" cy="10" r="2.6"/><path d="M3 20c1-3.5 3.3-5 6-5s5 1.5 6 5M15.5 15.2c2.6-.4 4.6.9 5.5 3.8"/></svg>Pool<span class="n" id="n-pool" hidden></span></a>
      <a href="#dates" data-tab="dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>Dates<span class="n" id="n-dates" hidden></span></a>
      <a href="#rank" data-tab="rank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Rankings</a>
      <a href="#add" data-tab="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</a>
    </nav>
  </div>
  <div id="pipe"></div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= state ================= */
let S = {people: {}, dates: {}, rankings: {}, pipeline: {running: false, step: ''}};
let loaded = false, lastJSON = '', lastRoute = '', busy = false, enterT, huntCount = 25;
const seenLog = {}, seenChat = {};
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
let ME = LS.get('ph_user') || '';
function setMe(id) { ME = id || ''; LS.set('ph_user', ME || null); }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const enc = s => esc(encodeURIComponent(s));
const arr = x => Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]);
const num = x => Math.max(0, Math.min(100, Math.round(+x || 0)));
const href = u => /^https?:\/\//i.test(u || '') ? esc(u) : '#';
const imgSrc = u => /^(https?:\/\/|data:image\/)/i.test(u || '') ? esc(u) : '';
const P = id => S.people[id] || {id, name: 'Someone who left'};
const handle = u => (String(u || '').match(/instagram\.com\/([^/?#]+)/i) || [])[1] || '';
const nm = p => p.name || p.profile?.name || (handle(p.instagram) ? '@' + handle(p.instagram) : 'Someone new');
const first = p => nm(p).replace(/^@/, '').split(/\s+/)[0];
const hue = s => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const initials = p => nm(p).replace(/^@/, '').split(/[\s._]+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
const av = (p, c = '') => { const s = imgSrc(p.photo);
  return `<span class="av ${c}" style="--h:${hue(p.id || nm(p))}" aria-hidden="true">${esc(initials(p))}${s ? `<img src="${s}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : ''}</span>`; };
const txt = x => x && typeof x === 'object' ? Object.values(x).join(', ') : (x ?? '');
const tags = (xs, c = '') => arr(xs).length ? `<div class="tags">${arr(xs).map(x => `<span class="tag ${c}">${esc(txt(x))}</span>`).join('')}</div>` : '<p class="mute">Not yet known</p>';
const para = v => Array.isArray(v) ? tags(v) : (v ? `<p>${esc(txt(v))}</p>` : '<p class="mute">Not yet known</p>');
const fact = (t, v, c) => `<div><h4>${t}</h4>${Array.isArray(v) ? tags(v, c) : para(v)}</div>`;
const isErr = s => /^error/i.test(s || '');
const isWork = s => !!s && s !== 'ready' && s !== 'done' && !isErr(s);
const pill = s => { s = s || 'queued'; const k = isErr(s) ? 'bad' : (s === 'ready' || s === 'done') ? 'ok' : s === 'on the date' ? 'live' : 'work';
  const label = s === 'ready' ? 'ready' : s;
  return `<span class="pill ${k}" title="${esc(s)}">${k === 'work' || k === 'live' ? '<i class="dot"></i>' : ''}${esc(label.length > 42 ? label.slice(0, 40) + '…' : label)}</span>`; };
const ring = (x, s = 64) => { const r = (s - 6) / 2, c = 2 * Math.PI * r, v = num(x), cls = v >= 70 ? '' : v >= 45 ? 'mid' : 'low';
  return `<span class="ring ${cls}" style="width:${s}px;height:${s}px;--rs:${s}px" role="img" aria-label="Score ${v} out of 100"><svg viewBox="0 0 ${s} ${s}"><circle class="trk" cx="${s / 2}" cy="${s / 2}" r="${r.toFixed(1)}"/><circle class="val" cx="${s / 2}" cy="${s / 2}" r="${r.toFixed(1)}" style="--c:${c.toFixed(1)};stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${(c * (1 - v / 100)).toFixed(1)}"/></svg><b>${v}</b></span>`; };
const bar = x => `<span class="bar"><span class="t"><i style="--w:${num(x)}%"></i></span><b>${num(x)}</b></span>`;
const kindB = p => p.kind === 'user' ? '<span class="badge u">Member</span>'
  : p.found_by ? `<span class="badge f">Found by ${esc(first(P(p.found_by)))}'s agent</span>` : '<span class="badge">Added by link</span>';
const stageB = r => r.stage === 'dated' ? '<span class="stage dated">Dated</span>' : '<span class="stage pre">Pre-date estimate</span>';
const human = k => String(k).replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ').trim().replace(/^./, c => c.toUpperCase());
const fmtT = t => { const d = new Date((+t || 0) * 1000); return isNaN(d) ? '--:--:--' : d.toTimeString().slice(0, 8); };
const people = () => Object.values(S.people);
const users = () => people().filter(p => p.kind === 'user');
const meP = () => (ME && S.people[ME]) || null;
const datesOf = id => Object.values(S.dates).filter(d => d.a === id || d.b === id);
const findDate = (a, b) => Object.values(S.dates).filter(d => ((d.a === a && d.b === b) || (d.a === b && d.b === a)) && !isErr(d.status)).pop();
const liveFirst = ds => ds.slice().reverse().sort((x, y) => (isWork(y.status) ? 1 : 0) - (isWork(x.status) ? 1 : 0));
const dateBtn = (a, b, id) => { const d = (id && S.dates[id]) || findDate(a, b);
  return d ? `<a class="btn ghost sm" href="#d/${enc(d.id)}">${isWork(d.status) ? '<i class="dot" style="color:var(--acc)"></i>Watch live' : 'Read the date'}</a>`
    : `<button class="sm" data-act="date" data-a="${esc(a)}" data-b="${esc(b)}">Send on a date</button>`; };
const B = (k, html, cls = '') => `<section class="blk ${cls}" data-k="${esc(k)}">${html}</section>`;
const empty = (title, msg, cta = '') => `<div class="card empty"><h3>${title}</h3><p>${msg}</p>${cta}</div>`;
const loading = () => B('loading', '<div class="card empty"><div class="row" style="justify-content:center;color:var(--mute)"><span class="spin"></span>Loading the pool…</div></div>');

/* generic recursive renderer for scraped JSON */
function tree(v, d = 0) {
  if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'number') return esc(isFinite(v) ? v.toLocaleString() : String(v));
  if (typeof v !== 'object') { const s = String(v);
    if (/^https?:\/\/\S+$/i.test(s)) return /\.(jpe?g|png|webp|gif)(\?|$)|cdninstagram|fbcdn|licdn|media\./i.test(s)
      ? `<a href="${href(s)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(s)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentNode.remove()"></a>`
      : `<a class="url" href="${href(s)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/i, '').slice(0, 60))}</a>`;
    return s.length > 220 ? `<div class="clamp" data-act="clamp" title="Click to expand">${esc(s)}</div>` : esc(s); }
  if (d > 5) return `<code>${esc(JSON.stringify(v).slice(0, 200))}</code>`;
  if (Array.isArray(v)) {
    if (v.every(x => x != null && typeof x !== 'object' && String(x).length < 60 && !/^https?:/i.test(x))) return tags(v);
    const objs = v.some(x => x && typeof x === 'object'), cls = objs ? 'minis' : 'list';
    const items = v.map(x => tree(x, d + 1)).filter(Boolean).map(h => `<div class="${objs ? 'mini' : ''}">${h}</div>`);
    return `<div class="${cls}">${items.slice(0, 6).join('')}</div>` + (items.length > 6 ? `<details><summary>${items.length - 6} more</summary><div class="${cls}">${items.slice(6).join('')}</div></details>` : ''); }
  const rows = Object.entries(v).map(([k, x]) => { const h = tree(x, d + 1); return h ? `<div class="kv"><div class="k">${esc(human(k))}</div><div class="v">${h}</div></div>` : ''; }).join('');
  return rows ? `<div class="kvs">${rows}</div>` : '';
}

/* ================= shared pieces ================= */
function personCard(p, opts = {}) {
  const work = isWork(p.status), top = (p.search?.matches || []).find(m => S.people[m.id]);
  return `<a class="card pcard ${work ? 'working' : ''}" href="#p/${enc(p.id)}">
    <div class="hd">${av(p, 'lg')}<div class="grow"><div class="nm">${esc(nm(p))}</div><div class="hl">${esc(p.profile?.headline || (work ? 'The agent is reading their profile…' : ''))}</div></div></div>
    ${opts.reason && p.found_reason ? `<div class="rs">${esc(p.found_reason)}</div>` : ''}
    ${opts.top && top ? `<div class="row small mute" style="gap:8px">Top fit ${av(P(top.id), 'xs')}<b style="color:var(--ink)">${esc(nm(P(top.id)))}</b>${num(top.fit)}</div>` : ''}
    <div class="ft">${opts.kind === false ? '' : kindB(p)}${pill(p.status)}</div></a>`;
}
function logFeed(p, fresh) {
  const L = arr(p.log), from = fresh || seenLog[p.id] == null ? L.length : seenLog[p.id], run = !!p.hunt?.running;
  seenLog[p.id] = L.length;
  if (!L.length) return `<ol class="log autoscroll"><li class="${run ? 'cursor' : ''}"><time>${fmtT(Date.now() / 1000)}</time><i class="k"></i><span>${run ? 'Agent waking up' : 'Your agent is idle. Send it hunting to see it work.'}</span></li></ol>`;
  return `<ol class="log autoscroll" aria-live="polite">${L.map((l, i) => { const t = String(l.text ?? '');

  const meA = $('nav.tabs a[data-tab=me]'); if (meA) meA.setAttribute('href', ME ? '#me' : '#welcome');
  const live = Object.values(S.dates).filter(d => isWork(d.status)).length, working = people().filter(p => isWork(p.status) || p.hunt?.running).length;
  const nd = $('#n-dates'), np = $('#n-pool');

  if (np) { np.hidden = !working; np.textContent = working; np.style.background = 'var(--amb)'; np.style.color = '#000'; }
  const pl = S.pipeline || {}, pipe = pl.running ? `<div class="pipe"><div class="top-in"><span class="spin" style="color:var(--amb)"></span><b>Everyone's agents are running</b><span class="grow" style="color:var(--ink2)">${esc(pl.step || 'starting')}</span><span class="row small" style="gap:6px">${stageText()}</span></div></div>` : '';
  const pe = $('#pipe'); if (pe && pe.innerHTML !== pipe) pe.innerHTML = pipe;
}
function patch(app, html) {
  const t = document.createElement('template'); t.innerHTML = html;
  const norm = s => s.replace(/ is-new/g, '');
  const old = {}; [...app.children].forEach(e => { if (e.dataset && e.dataset.k) old[e.dataset.k] = e; });
  const next = [...t.content.children].map(n => { const k = n.dataset.k, h = norm(n.outerHTML), o = k && old[k];
    if (o && o._h === h) return o; n._h = h; n._fresh = true; return n; });
  [...app.children].forEach(e => { if (!next.includes(e)) e.remove(); });
  next.forEach((n, i) => { if (app.children[i] !== n) app.insertBefore(n, app.children[i] || null); });

}
function render(force) {

  chrome();
  const [v, arg] = route(), key = v + '/' + arg, app = $('#app'), changed = key !== lastRoute;
  if (NOAUTO[v] && !changed && !force) return;  // never wipe a form while someone types
  if (v === 'onboard') { lastRoute = key; obRender(changed ? 'none' : ''); app.classList.remove('enter'); return; }
  const html = views[v](arg, changed);
  let freshNodes;

    app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); clearTimeout(enterT); enterT = setTimeout(() => app.classList.remove('enter'), 900); scrollTo(0, 0);

}
function load(s) { S = {...s, people: s?.people || {}, dates: s?.dates || {}, rankings: s?.rankings || {}, pipeline: s?.pipeline || {running: false, step: ''}}; loaded = true; }

  if (busy) return; busy = true;
  try { const t = await fetch('/api/state', {cache: 'no-store'}).then(r => r.text());
    if (t !== lastJSON) { lastJSON = t; load(JSON.parse(t)); render(); }
  } catch (e) { /* server restarting; retry next tick */ } finally { busy = false; }
}
function toast(msg, bad) { const t = $('#toast'); if (!t) return; t.textContent = msg; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3400); }
async function api(path, body) {
  try { const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    const j = await r.json().catch(() => ({error: 'The server answered with HTTP ' + r.status}));
    if (!r.ok || j.error) { toast(j.error || 'The server answered with HTTP ' + r.status, true); return null; }
    lastJSON = ''; refresh(); return j;
  } catch (e) { toast('Could not reach the server. Check that it is running.', true); return null; }
}
const personApi = id => `/api/people/${encodeURIComponent(id)}/`;

/* ================= events ================= */
if (typeof document !== 'undefined' && document.getElementById('app')) {
  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset;
    switch (a.act) {
      case 'clamp': return t.classList.toggle('open');
      case 'one': { setP(a.f, a.v); t.closest('.chips').querySelectorAll('.chip').forEach(c => { const on = c === t; c.classList.toggle('on', on); c.setAttribute('aria-checked', on); }); return; }
      case 'tog': { const l = ob[a.f], i = l.indexOf(a.v); i < 0 ? l.push(a.v) : l.splice(i, 1); saveDraft(); t.classList.toggle('on', i < 0); t.setAttribute('aria-pressed', i < 0); return; }
      case 'addc': return addCustom(a.f);
      case 'rmphoto': ob.photo = ''; saveDraft(); return obRender('none');
      case 'obnext': return obNext();
      case 'obback': obErr = ''; obStep = Math.max(0, obStep - 1); obRender('back'); return scrollTo(0, 0);
      case 'obgo': obErr = ''; obStep = +a.i || 0; obRender('back'); return scrollTo(0, 0);
      case 'switch': e.preventDefault(); setMe(a.id); location.hash = 'me'; lastRoute = ''; return render(true);
      case 'demoperson': { const b = blankOb(), d = S.demo_person || {};
        ob = {...b, ...d, lifestyle: {...b.lifestyle, ...(d.lifestyle || {})}, prompts: {...b.prompts, ...(d.prompts || {})}};
        obStep = OB.length - 1; obErr = ''; obRender('back'); return scrollTo(0, 0); }
      case 'newagent': ob = blankOb(); obStep = 0; obErr = ''; LS.set('ph_draft', null); return;
      case 'hcount': huntCount = +a.n || 25; return render(true);
    }
    if (t.tagName === 'BUTTON') { if (t.disabled) return; t.disabled = true; setTimeout(() => { t.disabled = false; }, 1500); }
    switch (a.act) {
      case 'obsubmit': return obSubmit();
      case 'hunt': if (await api(`/api/users/${encodeURIComponent(ME)}/hunt`, {count: huntCount})) toast(`Your agent is hunting for ${huntCount} people`); break;
      case 'run': if (await api('/api/run')) toast('Everyone is running: search, date, rank'); break;
      case 'date': { const r = await api('/api/date', {a: a.a, b: a.b}); if (r?.id) location.hash = 'd/' + encodeURIComponent(r.id); break; }
      case 'analyze': if (await api(personApi(a.id) + 'analyze')) toast('The agent is re-reading their profile'); break;
      case 'search': if (await api(personApi(a.id) + 'search')) toast('The agent is searching the pool'); break;
      case 'del': if (confirm(`Delete ${a.name} and all their dates?`) && await api(personApi(a.id) + 'delete')) { if (a.id === ME) setMe(''); toast(`Deleted ${a.name}`); location.hash = a.id === ME ? 'welcome' : 'pool'; } break;
      case 'addOne': { const g = k => ($('#' + k)?.value || '').trim();
        if (!/linkedin\.com\//i.test(g('li')) || !/instagram\.com\//i.test(g('ig'))) return toast('Add both a LinkedIn and an Instagram profile URL', true);
        if (await api('/api/people', {people: [{linkedin: g('li'), instagram: g('ig'), li_text: g('lit'), ig_text: g('igt'), gender: g('gen')}]})) { toast('Added. Their agent is reading their profile.'); location.hash = 'pool'; }
        break; }
      case 'addBulk': { const ps = ($('#bulk')?.value || '').split('\n').map(l => l.trim().split(/[\s,;]+/).filter(Boolean)).filter(x => x.length >= 2)
          .map(x => ({linkedin: x.find(u => /linkedin\.com/i.test(u)) || x[0], instagram: x.find(u => /instagram\.com/i.test(u)) || x[1], li_text: '', ig_text: '', gender: ''}));
        if (!ps.length) return toast('One person per line: LinkedIn URL, then Instagram URL', true);
        const r = await api('/api/people', {people: ps}); if (r) { toast(`Added ${(r.ids || ps).length} people`); location.hash = 'pool'; }
        break; }
    }
  });
  function addCustom(f) { const i = document.querySelector(`input[data-custom="${f}"]`), v = (i?.value || '').trim();
    if (!v) return; if (!ob[f].some(x => x.toLowerCase() === v.toLowerCase())) ob[f].push(v); saveDraft(); obRender('none');
    const ni = document.querySelector(`input[data-custom="${f}"]`); if (ni) ni.focus(); }
  window.addCustom = addCustom;
  document.addEventListener('input', e => { const f = e.target.dataset?.ob; if (!f) return;
    let v = e.target.value;
    if (f === 'age_min' || f === 'age_max') { v = +v; if (f === 'age_min' && v > +ob.age_max) { ob.age_max = v; const o = document.querySelector('[data-ob=age_max]'); if (o) o.value = v; $('#v-age_max').textContent = v; }
      if (f === 'age_max' && v < +ob.age_min) { ob.age_min = v; const o = document.querySelector('[data-ob=age_min]'); if (o) o.value = v; $('#v-age_min').textContent = v; }
      $('#v-' + f).textContent = v; }
    setP(f, v); if (obErr) { obErr = ''; const er = $('#ob-err'); if (er) er.textContent = ''; } });
  document.addEventListener('change', async e => { if (e.target.id !== 'ob-photo' || !e.target.files?.[0]) return;
    try { ob.photo = await downscale(e.target.files[0]); saveDraft(); obRender('none'); } catch (err) { toast(err.message, true); } });
  document.addEventListener('keydown', e => { if (e.key !== 'Enter' || route()[0] !== 'onboard' || e.isComposing) return;
    const el = e.target; if (el.tagName === 'TEXTAREA' || el.tagName === 'BUTTON' || el.tagName === 'A') return;
    e.preventDefault(); if (el.dataset?.custom) return addCustom(el.dataset.custom);
    OB.length - 1 === obStep ? obSubmit() : obNext(); });
  window.addEventListener('hashchange', () => render());
  render(); refresh(); setInterval(refresh, 1500);
}
</script>
